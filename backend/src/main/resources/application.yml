server:
  port: 8080

spring:
  application:
    name: meeting-room
  mvc:
    throw-exception-if-no-handler-found: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/meeting_room?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 密码通过环境变量注入，避免明文入库（B-12）。启动前设置环境变量 MYSQL_PASSWORD，
    # 也可用启动参数 --spring.datasource.password=xxx 覆盖
    password: ${MYSQL_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# Sa-Token 配置
sa-token:
  token-name: satoken
  # 有效期 2 小时（B-10）：缩短 Token 有效期，配合前端重新登录
  timeout: 7200
  # 超过 30 分钟无操作自动过期，实现"续期"效果（B-10）
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: true
